<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcend - An Interactive Magazine</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/magazine-flip.css">
    <link rel="stylesheet" href="css/exploration.css">
    <link rel="stylesheet" href="css/enhanced-magazine.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Loading Screen -->
        <div id="loader" class="loader active">
            <div class="loader-text">Loading...</div>
        </div>

        <!-- Magazine View -->
        <div id="magazine-view" class="magazine-view active">
            <!-- StPageFlip Container -->
            <div id="flipbook" class="flipbook-container">
                <!-- Initial Magazine: Pages 1-8 only -->
                <!-- Left side of cover spread - matches website background perfectly -->
                <div class="page background-page">
                    <div class="page-content background-content">
                        <!-- This page will be invisible and match your website background -->
                    </div>
                </div>
                
                <!-- Cover (right side of first spread) -->
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/cover.jpg" alt="Transcend Magazine Cover">
                    </div>
                </div>
                
                <!-- Magazine Pages 1-8 ONLY -->
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-1.jpg" alt="Page 1">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-2.jpg" alt="Page 2">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-3.jpg" alt="Page 3">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-4.jpg" alt="Page 4">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-5.jpg" alt="Page 5">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-6.jpg" alt="Page 6">
                    </div>
                </div>
                
                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-7.jpg" alt="Page 7">
                    </div>
                </div>

                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-8.jpg" alt="Page 8">
                    </div>
                </div>

                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-9.jpg" alt="Page 9">
                    </div>
                </div>

                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-10.jpg" alt="Page 10">
                    </div>
                </div>

                <div class="page">
                    <div class="page-content">
                        <img src="assets/magazine/page-11.jpg" alt="Page 11">
                    </div>
                </div>
                
                <!-- Dissolution Trigger Page - LAST PAGE -->
                <div class="page dissolution-trigger">
                    <div class="page-content">
                        <img src="assets/magazine/page-12.jpg" alt="Page 12">
                    </div>
                </div>
            </div>

            <!-- Dissolution Effects Container -->
            <div id="dissolution-container" class="dissolution-container hidden"></div>
        </div>

        <!-- ENHANCED Exploration View (replaces simple phoenix-rise) -->
        <div id="exploration-view" class="exploration-view hidden">
            <div class="navigation-hub">

                <!-- Navigation Buttons (Placeholder shapes for animator's GIFs) -->
                
                <!-- Constitutive Button -->
                <div class="nav-button constitutive" data-section="constitutive">
                    <div class="label">Constitutive</div>
                </div>

                <!-- Fear Button -->
                <div class="nav-button fear" data-section="fear">
                    <div class="label">Fear</div>
                </div>

                <!-- Temporal Button -->
                <div class="nav-button temporal" data-section="temporal">
                    <div class="label">Temporal</div>
                </div>

                <!-- Awareness Button -->
                <div class="nav-button awareness" data-section="awareness">
                    <div class="label">Awareness</div>
                </div>

                <!-- Interdependence Button -->
                <div class="nav-button interdependence" data-section="interdependence">
                    <div class="label">Interdependence</div>
                </div>

                <!-- Return Button -->
                <div class="return-button" onclick="returnToMagazine()">
                    ← Return to Magazine
                </div>
            </div>

            <!-- Notification Modal for section previews -->
            <div class="notification" id="notification">
                <h3 id="notificationTitle">Section Title</h3>
                <p id="notificationDescription">This is where the content would load...</p>
                <button onclick="closeNotification()">Continue Exploring</button>
            </div>

        <!-- Transition Overlay (for future dynamic loading) -->
        <div id="transition-overlay" class="transition-overlay hidden">
            <!-- Transition GIFs will be inserted here -->
        </div>
    </div>

    <!-- StPageFlip Library -->
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/magazine-flip.js"></script>
    <script src="js/dissolution.js"></script>
    <script src="js/exploration.js"></script>
    <script src="js/meditation-transcendence.js"></script>
</body>
</html>
